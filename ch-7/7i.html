<!DOCTYPE html>
<html>

<body>
  <script>
    // 1mile=5280ft , 1km=3281ft;
    function convertLength(length, from, to) {
      if (from !== 'km' && from !== 'miles' && from !== 'ft') {
        return `Invalid unit: ${from}`;
      } else if (to !== 'km' && to !== 'miles' && to !== 'ft') {
        return `Invalid unit: ${to}`;
      }
      if (from === 'miles' && to === 'km') {
        const result = length * 1.6;
        return `${result} ${to}`;
      } else if (from === 'km' && to === 'miles') {
        const result = length / 1.6;
        return `${result} ${to}`;
      } else if (from === 'miles' && to === 'ft') {
        const result = length * 5280;
        return `${result} ${to}`
      } else if (from === 'km' && to === 'ft') {
        const result = length * 3281;
        return `${result} ${to}`
      } else if (from === 'ft' && to === 'km') {
        const result = length;
        return `${result} ${to}`;
      } else if (from === 'ft' && to === 'miles') {
        const result = length;
        return `${result} ${to}`;
      } else if (from === to) {
        return `${length} ${to}`
      }
    }
    console.log(convertLength(5, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(5, 'km', 'ft'));
    console.log(convertLength(5, 'miles', 'ft'));
    console.log(convertLength(32, 'ft', 'miles'));
    console.log(convertLength(50, 'km', 'km'));
    console.log(convertLength(32, 'miles', 'miles'));
    console.log(convertLength(35, 'lbs', 'lbs'));
  </script>
</body>

</html>
