<!DOCTYPE html>
<Html>

<head>
  <title>Cart Quantity</title>
</head>

<body>
  <p>Cart Quantity</p>

  <!-- Show quantity -->
  <button onclick="
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">Show Quantity</button>

  <!-- Add to Cart -->
  <button onclick="
  if (cartQuantity + 1 > 10){
    alert('The cart is full');
  }else{
    cartQuantity++;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">Add to Cart</button>

  <!-- +2 -->
  <button onclick="
  if (cartQuantity +2 > 10){
    alert('The cart is full');
  }else{
    cartQuantity+=2;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">+2</button>


  <!-- +3 -->
  <button onclick="
  if (cartQuantity +3 > 10){
    alert('The cart is full');

  }else{
    cartQuantity+=3;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">+3</button>

  <!-- +4 -->
  <button onclick="
  if (cartQuantity +4 > 10){
    alert('The cart is full');

  }else{
    cartQuantity+=4;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
    
  ">+4</button>

  <!-- +5 -->
  <button onclick="
  if (cartQuantity +5 > 10){
    alert('The cart is full');
  }else{
    cartQuantity+=5;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">+5</button>

  <!-- Remove from Cart -->
  <button onclick="
  if (cartQuantity-1<0){
    alert('Not enough item in the cart');
  }
  else{
    cartQuantity--;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">Remove from Cart</button>

  <!-- -2 -->
  <button onclick="
  if(cartQuantity-2<0){
    alert('Not enough item in the cart');
  }else{
  cartQuantity-=2;
  console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">-2</button>

  <!-- -3 -->
  <button onclick="
  if(cartQuantity-3 < 0){
    alert('Not enough item in the cart');
  }
  else{
    cartQuantity-=3;
    console.log(`Cart Quantity: ${cartQuantity}`);
  }
  ">-3</button>


  <!-- Reset Cart -->
  <button onclick="
  console.log('Cart was reset.');
  cartQuantity=0;
  console.log(`Cart Quantity: ${cartQuantity}`);
  ">Reset Cart</button>

  <script>
    let cartQuantity = 0;
  </script>
</body>

</Html>
