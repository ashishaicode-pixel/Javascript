<!DOCTYPE html>
<html>

<head>
  <title>Buttons</title>
  <style>
    .cart-button {
      background-color: yellow;
    }

    .buy-button {
      background-color: rgb(255, 153, 0);
    }
  </style>
</head>

<body>
  <p>Adult Plain Cotton T-shirt</p>
  <p>Price: $7.99</p>
  <button class="cart-button">
    Add to cart
  </button>
  <button class="buy-button">
    Buy now
  </button>
</body>

</html>
